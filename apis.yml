- aid: truist:truist-open-banking-data-access
  name: Truist Open Banking Data Access (FDX-aligned)
  description: >-
    Consumer-permissioned data-sharing surface for Truist, delivered through the
    Truist Open Banking API Developer Portal and FDX-aligned, tokenized
    connections (including a Plaid data-access partnership) that replace
    credential sharing. This is the honest data-access reality for most Truist
    third-party access - aggregator and FDX-aligned rather than an open
    first-party production API.
  humanURL: https://truist-1132.my.site.com/truist/s/
