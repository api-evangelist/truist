name: Truist
kind: company
description: >-
  Truist Financial Corporation is a U.S. bank holding company headquartered in
  Charlotte, North Carolina, formed in December 2019 through the merger of BB&T
  and SunTrust Banks. Its principal subsidiary, Truist Bank, is a
  North Carolina state-chartered commercial bank and member of the Federal
  Reserve System, ranking among the largest U.S. commercial banks by assets and
  serving consumer, small-business, commercial, and wealth clients. On the API
  and open-finance side Truist runs a first-party Truist Developer Center at
  developer.truist.com that publishes registration-gated Open Banking APIs in a
  sandbox environment returning mock data (personal and small-business accounts,
  balances, transactions, and credit-transfer payments), and it operates a
  separate Truist Open Banking API Developer Portal for consumer-permissioned
  data sharing. Consumer data access is delivered largely through FDX-aligned,
  tokenized connections and aggregator partnerships (notably a Plaid data-access
  agreement) rather than an open first-party production API, and Truist states it
  monitors and complies with evolving CFPB Section 1033 personal-financial-data
  rules.
