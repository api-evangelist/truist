- aid: truist:truist-personal-and-small-business-accounts-api
  name: Truist Personal and Small Business Accounts API
  description: >-
    Open Banking API in the Truist Developer Center covering personal and
    small-business accounts - account information, balances, and transaction
    data. Documented in a registration-gated sandbox that returns mock demo
    responses; no downloadable OpenAPI/Swagger is published publicly.
  humanURL: https://developer.truist.com/api/personal-and-small-business-accounts/overview
